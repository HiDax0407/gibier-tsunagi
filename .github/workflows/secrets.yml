# GitHub 側でも秘密情報の検査をやり直す（手元の検査を飛ばされても、ここで見つける）
name: secret-check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 今のファイルを調べる
        run: node scripts/check-secrets.mjs --worktree
      - name: これまでの全コミットを調べる
        run: node scripts/check-secrets.mjs --history
      - name: テスト
        run: node --test
